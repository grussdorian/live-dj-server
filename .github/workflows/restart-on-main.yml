name: Restart service on main

on:
  push:
    branches: [ main ]

jobs:
  restart:
    name: Restart service
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Write .env from repository secrets
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
          PORT: ${{ secrets.PORT }}
          RATE_LIMIT: ${{ secrets.RATE_LIMIT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
          PLAYLIST_REQUESTS_ID: ${{ secrets.PLAYLIST_REQUESTS_ID }}
          PLAYLIST_LIVE_ID: ${{ secrets.PLAYLIST_LIVE_ID }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
        run: |
          # Spotify refresh token lives outside the checkout so `git clean` on deploy can't delete it
          TOKEN_DIR="$HOME/.live-dj-server"
          mkdir -p "$TOKEN_DIR" && chmod 700 "$TOKEN_DIR"

          umask 077
          : > .env
          for key in ACCESS_TOKEN USER_ID PORT RATE_LIMIT REDIS_PASSWORD \
                     SPOTIFY_CLIENT_ID SPOTIFY_CLIENT_SECRET SPOTIFY_REDIRECT_URI \
                     PLAYLIST_REQUESTS_ID PLAYLIST_LIVE_ID ADMIN_USER ADMIN_PASS ADMIN_JWT_SECRET; do
            value="${!key}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$key" "$value" >> .env
            else
              echo "::warning::Secret $key is not set"
            fi
          done
          printf 'NODE_ENV=production\nSPOTIFY_TOKEN_FILE=%s\n' "$TOKEN_DIR/spotify_tokens.json" >> .env
          echo ".env written"

      - name: Install dependencies
        run: npm install
        env:
          NODE_ENV: production

      - name: Restart server with PM2
        run: |
          # Delete + start (not restart) so pm2 runs this runner's checkout, not a path from an older runner
          npx pm2 delete live-dj-server 2>/dev/null || true
          npx pm2 start src/server.js --name live-dj-server
          npx pm2 save
        env:
          NODE_ENV: production
