<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fheya · DJ admin</title>
  <link rel="icon" href="/img/logo.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    .admin-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
    .login-box { max-width: 380px; }
    .login-box input + input { margin-top: 12px; }
    #spotifyStatus .row { font-size: 14px; }
    #spotifyStatus .row strong { font-family: var(--font-label); font-weight: normal; text-transform: uppercase; letter-spacing: .03em; }
    .warn { color: var(--error); }
    @media (max-width: 720px) { .admin-cols { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/dj"><img src="/img/logo.png" alt="Fheya"></a>
      <nav class="topnav">
        <a href="/dj">Live DJ</a>
        <a href="/admin" aria-current="page">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <span class="roman-tab">ii</span>
    <p class="pretitle" style="margin-top:22px">backstage</p>
    <h1 class="headline"><span>DJ</span><span class="line-2">admin.</span></h1>

    <div id="adminArea">
      <section id="loginBox" class="panel-dark login-box">
        <label class="field-label" for="adminUser">Admin login</label>
        <input id="adminUser" type="text" placeholder="user" value="admin" autocomplete="username" />
        <input id="adminPass" type="password" placeholder="password" autocomplete="current-password" />
        <div style="margin-top:18px"><button id="loginBtn">Sign in →</button></div>
      </section>

      <div id="panel" style="display:none">
        <div class="btn-row" style="align-items:center">
          <button id="logoutBtn" class="btn-plain btn-sm">Log out</button>
          <span class="caption">// approve or reject requests · remove live tracks</span>
        </div>

        <section class="card" style="margin-top:24px">
          <h3>Spotify</h3>
          <div id="spotifyStatus"></div>
        </section>

        <div class="admin-cols section">
          <section>
            <div class="section-head"><div><p class="pretitle">inbox</p><h2>Requests</h2></div></div>
            <div id="requests" class="list muted">Loading…</div>
          </section>
          <section>
            <div class="section-head"><div><p class="pretitle">on air</p><h2>Live</h2></div></div>
            <div id="live" class="list numbered muted">Loading…</div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
  <script>
    const socket = io();
    async function checkAuth(){
      const r = await fetch('/api/admin/me', {credentials:'include'});
      const j = await r.json();
      if (j && j.auth) showPanel(); else showLogin();
    }
    function showLogin(){ document.getElementById('loginBox').style.display='block'; document.getElementById('panel').style.display='none'; }
    async function showPanel(){ document.getElementById('loginBox').style.display='none'; document.getElementById('panel').style.display='block'; socket.emit('get_requests'); socket.emit('get_live'); await refreshSpotifyStatus(); }

    async function refreshSpotifyStatus(){
      const el = document.getElementById('spotifyStatus'); el.innerHTML = '<p class="caption">// checking spotify…</p>';
      try {
        const r = await fetch('/api/spotify/status'); const j = await r.json();
        if(!j.ok){ el.innerHTML = '<p class="caption">// spotify status unavailable</p>'; return }
        const linked = j.linked;
        const me = j.me;
        const owner = j.playlistOwner;
        const ownerMatch = j.ownerMatch;
        el.innerHTML = `<div class="row">Linked: <strong>${linked ? 'Yes' : 'No'}</strong></div>`;
        if(linked && me){ el.innerHTML += `<div class="row">Authorized as: <strong>${me.display_name||''} (${me.id})</strong></div>`; }
        if(owner){ el.innerHTML += `<div class="row">Playlist owner: <strong>${owner}</strong></div>`; }
        if(linked && owner){
          if(ownerMatch) el.innerHTML += `<p class="caption">// account matches playlist owner</p>`;
          else el.innerHTML += `<p class="caption warn">// owner mismatch · re-link with the playlist owner's account</p>`;
        }
        el.innerHTML += `<div class="btn-row" style="margin-top:16px"><button id="relinkBtn" class="btn-sm">Re-link Spotify</button><button id="clearLinkBtn" class="btn-plain btn-sm">Clear link</button><button id="testWriteBtn" class="btn-plain btn-sm">Test write</button><button id="syncBtn" class="btn-warm btn-sm">Sync Spotify → Redis</button></div><p id="syncMessage" class="caption" style="margin-top:10px"></p>`;
        document.getElementById('relinkBtn').addEventListener('click', ()=>{ window.location.href='/auth/spotify'; });
        document.getElementById('clearLinkBtn').addEventListener('click', async ()=>{ await fetch('/auth/relink',{headers:{Accept:'application/json'}}); setTimeout(refreshSpotifyStatus,500); });
        document.getElementById('testWriteBtn').addEventListener('click', async ()=>{
          const btn = document.getElementById('testWriteBtn'); btn.textContent='Testing…'; btn.disabled=true;
          try {
            const r = await fetch('/api/spotify/test-add',{credentials:'include'}); const j = await r.json();
            let msg = j.ok ? 'Write test passed.' : 'Write test failed.';
            if(j.results && j.results.steps) msg += '\n' + j.results.steps.map(s=>`[${s.ok?'ok':'fail'}] ${s.step}: ${s.error||s.status||'ok'}`).join('\n');
            if(j.results && j.results.responseHeaders) msg += '\nHeaders: ' + JSON.stringify(j.results.responseHeaders);
            alert(msg);
          } catch(e){ alert('Test failed: '+e.message); }
          btn.textContent='Test write'; btn.disabled=false;
        });
        document.getElementById('syncBtn').addEventListener('click', async ()=>{
          const btn = document.getElementById('syncBtn');
          const msgEl = document.getElementById('syncMessage');
          btn.textContent='Syncing…'; btn.disabled=true;
          msgEl.textContent = '';
          try{
            const r = await fetch('/api/admin/sync_playlists',{method:'POST',headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({ direction: 'spotify->redis' })});
            const j = await r.json();
            if (j.ok) {
              // display counts; include Spotify total if available
              let text = '// sync complete ·';
              if(j.result.requests) {
                text += ` requests ${j.result.requests.syncedCount}` +
                        (j.result.requests.spotifyTotal != null ? `/${j.result.requests.spotifyTotal}` : '');
                if(j.result.requests.spotifyTotal != null && j.result.requests.syncedCount !== j.result.requests.spotifyTotal) {
                  console.warn('requests sync count mismatch', j.result.requests);
                }
              }
              if(j.result.live) {
                text += ` · live ${j.result.live.syncedCount}` +
                        (j.result.live.spotifyTotal != null ? `/${j.result.live.spotifyTotal}` : '');
                if(j.result.live.spotifyTotal != null && j.result.live.syncedCount !== j.result.live.spotifyTotal) {
                  console.warn('live sync count mismatch', j.result.live);
                }
              }
              msgEl.textContent = text;
            } else {
              msgEl.textContent = '// sync failed · ' + (j.error||'unknown');
            }
            // ask server for fresh data in case socket events were missed
            socket.emit('get_requests');
            socket.emit('get_live');
          }catch(e){ msgEl.textContent = '// sync error · '+e.message; }
          btn.textContent='Sync Spotify → Redis'; btn.disabled=false;
        });
      } catch (e){ el.innerHTML = '<p class="caption">// error checking spotify status</p>'; }
    }

    document.getElementById('loginBtn').addEventListener('click', async ()=>{
      const user = document.getElementById('adminUser').value;
      const pass = document.getElementById('adminPass').value;
      const r = await fetch('/api/admin/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user,pass}), credentials:'include'});
      const j = await r.json(); if (j.ok) { showPanel(); } else alert('Login failed');
    });
    document.getElementById('adminPass').addEventListener('keyup', e => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
    document.getElementById('logoutBtn').addEventListener('click', async ()=>{ await fetch('/api/admin/logout',{method:'POST',credentials:'include'}); checkAuth(); });

    socket.on('requests_update', data => renderRequests(data));
    socket.on('live_update', data => renderLive(data));

    async function approve(id){
      const res = await fetch('/api/admin/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({trackId:id}), credentials:'include'});
      const j = await res.json(); if(!j.ok) alert('Error: '+(j.error||'unknown'));
    }
    async function rejectReq(id){
      const res = await fetch('/api/admin/reject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({trackId:id}), credentials:'include'});
      const j = await res.json(); if(!j.ok) alert('Error: '+(j.error||'unknown'));
    }
    async function removeLive(id){
      const res = await fetch('/api/admin/remove_live',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({trackId:id}), credentials:'include'});
      const j = await res.json(); if(!j.ok) alert('Error: '+(j.error||'unknown'));
    }

    function renderRequests(list){
      const root = document.getElementById('requests'); root.innerHTML='';
      if(!list || list.length===0){ root.innerHTML='<div class="caption">// no requests</div>'; return }
      list.forEach(item=>{
        const el = document.createElement('div'); el.className='item';
        const spotifyNote = (item.spotifyAddedToRequests === false) ? `<div class="caption warn">// not added to spotify · ${item.spotifyError||'unknown'}</div>` : '';
        const retryBtn = (item.spotifyAddedToRequests === false) ? `<button class="btn-warm btn-sm" onclick="retrySpotify('${item.track.id}')">Retry</button>` : '';
        el.innerHTML = `<div class="thumb" style="background-image:url(${item.track.albumImage});background-size:cover"></div><div class="meta"><div><strong>${item.track.title}</strong></div><div class="muted small">${item.track.artists}</div>${spotifyNote}</div><div class="item-actions"><button class="btn-sm" onclick="approve('${item.track.id}')">Approve</button><button class="btn-plain btn-sm" onclick="rejectReq('${item.track.id}')">Reject</button>${retryBtn}</div>`;
        root.appendChild(el);
      })
    }
    async function retrySpotify(id){
      const res = await fetch('/api/admin/retry_spotify_request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({trackId:id}), credentials:'include'});
      const j = await res.json(); if(!j.ok) alert('Error: '+(j.error||'unknown'));
    }
    function renderLive(list){
      const root = document.getElementById('live'); root.innerHTML='';
      if(!list || list.length===0){ root.innerHTML='<div class="caption">// no live tracks</div>'; return }
      list.forEach(item=>{
        const el = document.createElement('div'); el.className='item';
        el.innerHTML = `<div class="thumb" style="background-image:url(${item.track.albumImage});background-size:cover"></div><div class="meta"><div><strong>${item.track.title}</strong></div><div class="muted small">${item.track.artists}</div></div><div class="item-actions"><button class="btn-plain btn-sm" onclick="removeLive('${item.track.id}')">Remove</button></div>`;
        root.appendChild(el);
      })
    }

    checkAuth();
  </script>
</body>
</html>
